# Build-time surface policy for the acme-appsec internal plugin package.
# Uses an allowlist: only the skills and hooks listed here are included in the
# built plugin. New upstream skills and org-skills/ entries are excluded by
# default until explicitly added.
# Full list of available skills and hooks:
# https://github.com/matthiasrohr/appsec-advisor/blob/main/docs/internal-plugin-packaging.md
plugin_surface:
  skills:
    include:
      - create-threat-model
      - ask-threat-model
      - review-threat-model
      - show-threat-model
      - audit-security-requirements
      - verify-requirements
      - status
      - check-permissions
      - clean-run-state
      - fix-run-issues
      - threat-model-health
      # Add organization-owned skills from org-skills/<name>/ here, for example:
      # - acme-architecture-review
  hooks:
    include:
      - agent-logger
      # Org-declared hooks from org-profile.yaml (hooks:) must be listed here to
      # be included in the build — this is an allowlist.
      - block-risky-bash
