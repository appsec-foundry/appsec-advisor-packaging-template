# Build-time surface policy for the acme-appsec internal plugin package.
# Uses an allowlist: only the skills, hooks, and MCP servers listed here are
# included in the built plugin. New upstream skills, org-skills/ entries, org
# hooks, and MCP servers are excluded by default until explicitly added.
# Full list of available upstream skills and hooks:
# https://github.com/appsec-foundry/appsec-advisor/blob/main/docs/internal-plugin-packaging.md
plugin_surface:
  skills:
    include:
      # Replaced after packaging with a reference generated from this surface.
      - help
      - create-threat-model
      - update-threat-model
      - ask-threat-model
      - review-threat-model
      - show-threat-model
      - audit-security-requirements
      - verify-requirements
      - status
      - check-permissions
      - clean-run-state
      - fix-run-issues
      - threat-model-health
      # Secure-coding baseline. Without install-baseline the session status
      # reports a missing or outdated baseline and offers no command to fix it,
      # because the banner only names a skill the build actually ships.
      - install-baseline
      - verify-baseline
      - remove-baseline
      # Add organization-owned skills from org-skills/<name>/ here, for example:
      # - acme-architecture-review
  hooks:
    include:
      # Shows plugin, threat-model, and baseline status when a session starts.
      # Remove this entry (and set banner.enabled false) for a silent package.
      - session-banner
      - agent-logger
      # Enforces the disabled requirements skills declared in org-profile.yaml.
      - skill-policy-gate
      # Org-declared hooks from org-profile.yaml (hooks:) must be listed here to
      # be included in the build. Use a distinct, organization-prefixed id.
      - org-block-risky-bash
  mcp_servers:
    include:
      # Add server ids declared under mcp.servers in org-profile.yaml, for example:
      # - acme-sast

# Skills that the selected upstream ref may not have yet. Listing one here is
# the same explicit decision to ship it as an entry above — it is only allowed
# to be absent: a build from a ref that has the skill includes it, a build from
# an older ref skips it with a note instead of failing. Use this only for a
# skill upstream has on a branch but not yet in a release; everything already
# released belongs under plugin_surface.skills.include, where a typo still stops
# the build. What a build actually shipped is recorded in package-surface.json.
optional_skills:
  # Deterministic 0-100 score from the scanner layer; upstream has it on `dev`,
  # no release tag carries it yet. Included by APPSEC_ADVISOR_REF=dev builds.
  - security-score
  # Refreshes an installed baseline in place, wherever it is loaded from.
  # install-baseline picks a scope and wires an import; this one only rewrites
  # the file the rules already come from. No release tag carries it yet.
  - update-baseline
