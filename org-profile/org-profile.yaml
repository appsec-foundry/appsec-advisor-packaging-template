# Org profile for the acme-appsec internal plugin package.
# Replace the values under 'organization' and point 'requirements_yaml_url'
# to your internal catalog. Everything else is optional — see:
# https://github.com/appsec-foundry/appsec-advisor/blob/main/docs/org-profiles.md

api_version: appsec-advisor.org-profile/v2

organization:
  id: acme
  name: Acme Corp
  profile_version: "2026.06.1"
  owner: Acme AppSec Team

compatibility:
  core: ">=0.6 <0.7"

policy:
  disable_opus: true
  # Hosts the tool may fetch from (requirements catalog, related-repo models).
  # When set, every remote fetch is restricted to these hosts on top of the
  # always-on SSRF guard. Keep the internal catalog host reachable.
  url_allowlist:
    - security.example.internal
    - raw.githubusercontent.com

default_preset: ci-standard

requirements:
  source:
    requirements_yaml_url: "https://security.example.internal/appsec-requirements.yaml"
    human_source_url: "https://security.example.internal/appsec/requirements"
    label: "Acme Corp AppSec Requirements"
    cache: true
    fail_mode: cache_fallback
  create_threat_model:
    default_active: true
    quick_default_active: false
  standalone_audit:
    enabled: true

# Ship the requirements commands, but keep them unavailable until Acme enables
# its requirements catalog for users. The reason is shown when invoked.
skill_toggles:
  audit-security-requirements:
    enabled: false
    reason: "Acme AppSec has not enabled the requirements catalog for this package yet."
  verify-requirements:
    enabled: false
    reason: "Acme AppSec has not enabled the requirements catalog for this package yet."

llm_context:
  documents:
    - id: organization
      path: context/organization.md
      purpose: organization_background
      max_bytes: 50000

# Prompt-time security coaching: org-defined steering topics injected as
# advisory context (never model instructions). Each topic is triggers ->
# guidance + requirement IDs. See docs/security-coach-skill.md upstream.
security_coach:
  enabled_by_default: true
  max_requirements_per_topic: 3
  topics:
    payments:
      triggers: [payment, payout, refund, settlement]
      guidance: Payment flows must post to the ledger idempotently and require dual approval on refunds.
      requirements: [ACME-PAY-IDEMPOTENT, ACME-PAY-DUAL-APPROVAL]

actors:
  inherit_defaults: true
  add: actors/*.yaml

# Org-declared Claude Code hooks bundled into the packaged plugin's hooks.json.
# The script lives under org-profile/hooks/ and is referenced via
# ${CLAUDE_PLUGIN_ROOT}. Org hooks run at Claude Code's event layer only; they
# never reach the analysis pipeline. Each hook id must also be allowlisted in
# package-policy.yaml (plugin_surface.hooks) to be included in the build.
hooks:
  block-risky-bash:
    event: PreToolUse
    matcher: Bash
    command: python3 ${CLAUDE_PLUGIN_ROOT}/org-profile/hooks/guard.py

# Your own MCP servers — an internal SAST or SCA endpoint, for example. They are
# written into the packaged plugin's .mcp.json and start with it, so the tools
# are available in the session and to your own skills. The analysis pipeline
# does not call them: its agents ship a fixed tool list without MCP tools.
#
# Secrets belong in ${ENV_VAR}, which Claude Code expands at load time — a
# credential in the URL is rejected at validation. Each server must also be
# allowlisted in package-policy.yaml (plugin_surface.mcp_servers).
#
# mcp:
#   servers:
#     acme-sast:
#       type: http
#       url: https://sast.acme.internal/mcp
#       headers:
#         Authorization: Bearer ${ACME_SAST_TOKEN}

presets:
  ci-standard:
    base_mode: standard
    outputs:
      yaml: true
      sarif: true
    requirements:
      enabled: true
      # Default CI gate for the requirements skills. CLI flags
      # (--gate / --gate-on / --priority-floor) override these.
      gate:
        mode: enforce
        gate_on: fail
        priority_floor: MUST
    context:
      document_ids:
        - organization
    quality:
      qa_review: auto
      architecture_enrichment: auto
      architect_review: auto
      attack_walkthroughs: disabled
    guardrails:
      max_wall_time: 1h
      max_cost_usd: 20
      max_resumes: 2
      tracing: true
      # Headless/CI severity gate: non-zero exit when a run adds threats at or
      # above this severity. The --fail-on CLI flag overrides it.
      fail_on: high

  release-review:
    base_mode: thorough
    outputs:
      yaml: true
      sarif: true
      pdf: true
      pentest_tasks: true
    requirements:
      enabled: true
    context:
      document_ids:
        - organization
    quality:
      qa_review: enabled
      architecture_enrichment: enabled
      architect_review: auto
      attack_walkthroughs: auto
    verification:
      evidence_recheck: sampled
      generate_pentest_verification_tasks: true
    guardrails:
      max_wall_time: 3h
      max_cost_usd: 80
      max_resumes: 4
      tracing: true
      verbose_report: true
