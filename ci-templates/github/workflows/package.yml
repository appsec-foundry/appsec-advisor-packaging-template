name: package-internal-plugin

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  schedule:
    # Weekly upstream drift check (Mondays 06:00 UTC). Read-only — does not build.
    - cron: "0 6 * * 1"

permissions:
  contents: read

env:
  INTERNAL_NAME: ${{ vars.INTERNAL_NAME || 'acme-appsec' }}
  APPSEC_ADVISOR_URL: ${{ vars.APPSEC_ADVISOR_URL || 'https://github.com/matthiasrohr/appsec-advisor.git' }}
  APPSEC_ADVISOR_REF: ${{ vars.APPSEC_ADVISOR_REF }}
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  # shellcheck the build glue. Non-blocking until the scripts are verified
  # clean — drop continue-on-error to make lint findings fail the pipeline.
  lint:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest  # shellcheck + make are preinstalled
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Lint shell scripts
        run: make lint

  # Read-only: fails (exit 1) when the tracked upstream branch has moved.
  upstream-check:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout packaging repo
        uses: actions/checkout@v4
      - name: Check upstream for drift
        run: make upstream-check

  package:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout packaging repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: pip install --quiet pyyaml jsonschema packaging

      # The package version is derived by package-local.sh as
      # <upstream>+<org-id>.<org-rev>. ORG_REV identifies the org-side revision:
      # the repo tag on tag builds, else the commit. A VERSION repository
      # variable overrides the whole string.
      - name: Resolve org revision
        id: rev
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "org_rev=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "org_rev=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
          fi

      - name: Package and smoke-test plugin
        env:
          VERSION: ${{ vars.VERSION }}
          ORG_REV: ${{ steps.rev.outputs.org_rev }}
          ARCHIVE: "1"
        run: make package-archive

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.INTERNAL_NAME }}-${{ steps.rev.outputs.org_rev }}
          path: |
            dist/${{ env.INTERNAL_NAME }}-*.tgz
            dist/${{ env.INTERNAL_NAME }}-*.tgz.sha256
          retention-days: 30
