name: package-internal-plugin

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  schedule:
    # Weekly upstream drift check (Mondays 06:00 UTC). Read-only — does not build.
    - cron: "0 6 * * 1"

permissions:
  contents: read

env:
  INTERNAL_NAME: ${{ vars.INTERNAL_NAME || 'acme-appsec' }}
  PACKAGE_VERSION: ${{ vars.PACKAGE_VERSION || '0.1.0' }}
  APPSEC_ADVISOR_URL: ${{ vars.APPSEC_ADVISOR_URL || 'https://github.com/appsec-foundry/appsec-advisor.git' }}
  APPSEC_ADVISOR_REF: ${{ vars.APPSEC_ADVISOR_REF }}
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  # shellcheck the build glue. Non-blocking until the scripts are verified
  # clean — drop continue-on-error to make lint findings fail the pipeline.
  lint:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest  # shellcheck + make are preinstalled
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Lint shell scripts
        run: make lint

  # Read-only: fails (exit 1) when the tracked upstream branch has moved.
  upstream-check:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout packaging repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check upstream for drift
        run: make upstream-check

  package:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    outputs:
      package_version: ${{ steps.version.outputs.package_version }}
    steps:
      - name: Checkout packaging repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: python -m pip install --quiet --require-hashes -r ci-requirements.lock

      # A v* packaging-repository tag becomes the organization package version.
      # Branch builds use PACKAGE_VERSION; VERSION remains a one-off override.
      - name: Resolve package version
        id: version
        env:
          VERSION_OVERRIDE: ${{ vars.VERSION }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "package_version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "version_override=" >> "$GITHUB_OUTPUT"
          else
            echo "package_version=${PACKAGE_VERSION}" >> "$GITHUB_OUTPUT"
            echo "version_override=${VERSION_OVERRIDE}" >> "$GITHUB_OUTPUT"
          fi

      - name: Package and smoke-test plugin
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.package_version }}
          VERSION: ${{ steps.version.outputs.version_override }}
          ARCHIVE: "1"
        run: make release-package

      - name: Upload package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.INTERNAL_NAME }}-${{ steps.version.outputs.package_version }}
          path: |
            dist/${{ env.INTERNAL_NAME }}-*.tgz
            dist/${{ env.INTERNAL_NAME }}-*.tgz.sha256
            dist/${{ env.INTERNAL_NAME }}-*.zip
            dist/${{ env.INTERNAL_NAME }}-*.zip.sha256
          retention-days: 30

  # The package is platform-neutral, so ARM64 verifies the same packaging
  # path without publishing a duplicate archive with the same filename.
  package-arm64:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout packaging repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: python -m pip install --quiet --require-hashes -r ci-requirements.lock

      - name: Package and smoke-test plugin on ARM64
        run: make package

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [package, package-arm64]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download tested package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ env.INTERNAL_NAME }}-${{ needs.package.outputs.package_version }}
          path: dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/${INTERNAL_NAME}-*.tgz \
            dist/${INTERNAL_NAME}-*.tgz.sha256 \
            dist/${INTERNAL_NAME}-*.zip \
            dist/${INTERNAL_NAME}-*.zip.sha256 \
            --verify-tag \
            --title "${INTERNAL_NAME} ${GITHUB_REF_NAME#v}" \
            --notes-from-tag
