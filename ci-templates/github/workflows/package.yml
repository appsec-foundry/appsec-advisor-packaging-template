name: package-internal-plugin

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  schedule:
    # Weekly upstream drift check (Mondays 06:00 UTC). Read-only — does not build.
    - cron: "0 6 * * 1"

permissions:
  contents: read

env:
  INTERNAL_NAME: ${{ vars.INTERNAL_NAME || 'acme-appsec' }}
  APPSEC_ADVISOR_URL: ${{ vars.APPSEC_ADVISOR_URL || 'https://github.com/matthiasrohr/appsec-advisor.git' }}
  # Pin to a concrete release tag for reproducible builds. Set APPSEC_ADVISOR_REF in repository variables to override.
  APPSEC_ADVISOR_REF: ${{ vars.APPSEC_ADVISOR_REF || 'v0.5.0' }}
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  # shellcheck the build glue. Non-blocking until the scripts are verified
  # clean — drop continue-on-error to make lint findings fail the pipeline.
  lint:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest  # shellcheck + make are preinstalled
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Lint shell scripts
        run: make lint

  # Read-only: fails (exit 1) when a newer upstream v* release exists than the
  # pinned APPSEC_ADVISOR_REF, so the weekly run flags when to bump the pin.
  upstream-check:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout packaging repo
        uses: actions/checkout@v4
      - name: Check upstream for drift
        run: scripts/upstream-check.sh

  package:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout packaging repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: pip install --quiet pyyaml jsonschema packaging

      - name: Resolve version
        id: ver
        env:
          VERSION: ${{ vars.VERSION }}
        run: |
          if [ -n "${VERSION}" ]; then
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.4.0-internal.${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
          fi

      - name: Package and smoke-test plugin
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          ARCHIVE: "1"
        run: scripts/package-local.sh

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.INTERNAL_NAME }}-${{ steps.ver.outputs.version }}
          path: |
            dist/${{ env.INTERNAL_NAME }}-${{ steps.ver.outputs.version }}.tgz
            dist/${{ env.INTERNAL_NAME }}-${{ steps.ver.outputs.version }}.tgz.sha256
          retention-days: 30
