stages:
  - check
  - package
  - release

variables:
  INTERNAL_NAME: "acme-appsec"
  PACKAGE_VERSION: "0.1.0"
  APPSEC_ADVISOR_URL: "https://github.com/appsec-foundry/appsec-advisor.git"
  # Override for self-managed runners; GitLab.com provides this hosted tag.
  ARM64_RUNNER_TAG: "saas-linux-small-arm64"
  # PACKAGE_VERSION is organization-owned. A v* pipeline tag overrides it below;
  # VERSION remains available as a one-off CI/CD override.
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

default:
  image: python:3.11-slim
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git
    - python -m pip install --quiet --require-hashes -r ci-requirements.lock

# shellcheck the build glue. Non-blocking until the scripts are verified
# clean — drop allow_failure to make lint findings fail the pipeline.
lint:
  stage: check
  allow_failure: true
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends shellcheck
  script:
    - shellcheck scripts/*.sh $([ -f tests/run.sh ] && echo tests/run.sh)
  rules:
    - if: $CI_PIPELINE_SOURCE != "schedule"

# Read-only: fails (exit 1) when the tracked upstream branch has moved.
upstream-check:
  stage: check
  script:
    - make upstream-check
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"

package:
  stage: package
  rules:
    - if: $CI_PIPELINE_SOURCE != "schedule"
  script:
    # A packaging-repository tag defines the organization package release.
    - |
      if [ -n "${CI_COMMIT_TAG}" ]; then
        export PACKAGE_VERSION="${CI_COMMIT_TAG#v}"
        export VERSION=
      fi
      make release-package
  artifacts:
    name: "${INTERNAL_NAME}-${CI_COMMIT_REF_SLUG}"
    paths:
      - "dist/${INTERNAL_NAME}-*.tgz"
      - "dist/${INTERNAL_NAME}-*.tgz.sha256"
      - "dist/${INTERNAL_NAME}-*.zip"
      - "dist/${INTERNAL_NAME}-*.zip.sha256"
    expire_in: 30 days

# The package is platform-neutral, so ARM64 verifies the packaging path
# without publishing a duplicate archive with the same filename.
package-arm64:
  stage: package
  tags:
    - $ARM64_RUNNER_TAG
  rules:
    - if: $CI_PIPELINE_SOURCE != "schedule"
  script:
    - make package

# Tag releases require the project's Package Registry.
release:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:v1.58.0
  before_script: []
  needs:
    - job: package
      artifacts: true
    - job: package-arm64
      artifacts: false
  variables:
    GLAB_ENABLE_CI_AUTOLOGIN: "true"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
  script:
    - |
      glab release create "${CI_COMMIT_TAG}" \
        --name "${INTERNAL_NAME} ${CI_COMMIT_TAG#v}" \
        --notes "Internal ${INTERNAL_NAME} release ${CI_COMMIT_TAG#v}" \
        --no-update \
        --package-name "${INTERNAL_NAME}" \
        --use-package-registry \
        dist/${INTERNAL_NAME}-*.tgz \
        dist/${INTERNAL_NAME}-*.tgz.sha256 \
        dist/${INTERNAL_NAME}-*.zip \
        dist/${INTERNAL_NAME}-*.zip.sha256
