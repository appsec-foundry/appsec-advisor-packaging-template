stages:
  - check
  - package

variables:
  INTERNAL_NAME: "acme-appsec"
  APPSEC_ADVISOR_URL: "https://github.com/matthiasrohr/appsec-advisor.git"
  # Pin to a concrete release tag for reproducible builds. Override via CI/CD variables.
  APPSEC_ADVISOR_REF: "v0.4.0-beta"
  VERSION: "0.4.0-internal.${CI_COMMIT_SHORT_SHA}"
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

default:
  image: python:3.11-slim
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git
    - pip install --quiet pyyaml jsonschema packaging

# shellcheck the build glue. Non-blocking until the scripts are verified
# clean — drop allow_failure to make lint findings fail the pipeline.
lint:
  stage: check
  allow_failure: true
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends shellcheck
  script:
    - shellcheck scripts/*.sh tests/run.sh
  rules:
    - if: $CI_PIPELINE_SOURCE != "schedule"

# Read-only: fails (exit 1) when a newer upstream v* release exists than the
# pinned APPSEC_ADVISOR_REF. Run it on a scheduled pipeline to flag pin bumps.
upstream-check:
  stage: check
  script:
    - scripts/upstream-check.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"

package:
  stage: package
  rules:
    - if: $CI_PIPELINE_SOURCE != "schedule"
  script:
    - scripts/fetch-upstream.sh
    - >
      python3 upstream/appsec-advisor/scripts/package_internal_plugin.py
      --source upstream/appsec-advisor
      --org-profile org-profile
      --name "$INTERNAL_NAME"
      --version "$VERSION"
      --description "Internal packaged build of appsec-advisor with Acme Corp defaults."
    - python3 upstream/appsec-advisor/scripts/smoke_test_package.py "build/${INTERNAL_NAME}" --name "${INTERNAL_NAME}"
  artifacts:
    name: "${INTERNAL_NAME}-${VERSION}"
    paths:
      - "dist/${INTERNAL_NAME}-${VERSION}.tgz"
      - "dist/${INTERNAL_NAME}-${VERSION}.tgz.sha256"
    expire_in: 30 days
