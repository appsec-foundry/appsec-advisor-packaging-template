stages:
  - check
  - package

variables:
  INTERNAL_NAME: "acme-appsec"
  APPSEC_ADVISOR_URL: "https://github.com/appsec-foundry/appsec-advisor.git"
  # The package version is derived by package-local.sh as <upstream>+<org-id>.<org-rev>
  # (ORG_REV is set per-pipeline below). Set a VERSION CI/CD variable to override it.
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

default:
  image: python:3.11-slim
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git
    - pip install --quiet pyyaml jsonschema packaging

# shellcheck the build glue. Non-blocking until the scripts are verified
# clean — drop allow_failure to make lint findings fail the pipeline.
lint:
  stage: check
  allow_failure: true
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends shellcheck
  script:
    - shellcheck scripts/*.sh $([ -f tests/run.sh ] && echo tests/run.sh)
  rules:
    - if: $CI_PIPELINE_SOURCE != "schedule"

# Read-only: fails (exit 1) when the tracked upstream branch has moved.
upstream-check:
  stage: check
  script:
    - make upstream-check
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"

package:
  stage: package
  rules:
    - if: $CI_PIPELINE_SOURCE != "schedule"
  script:
    # Org revision: the repo tag on tag pipelines (v1.2.0 -> 1.2.0), else the commit.
    - export ORG_REV="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
    - export ORG_REV="${ORG_REV#v}"
    - make package-archive
  artifacts:
    name: "${INTERNAL_NAME}-${CI_COMMIT_SHORT_SHA}"
    paths:
      - "dist/${INTERNAL_NAME}-*.tgz"
      - "dist/${INTERNAL_NAME}-*.tgz.sha256"
    expire_in: 30 days
